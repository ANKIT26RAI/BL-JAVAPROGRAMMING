# -----------------------------
# Application
# -----------------------------
spring.application.name=${SPRING_APPLICATION_NAME:fundoo-notes}
server.port=${PORT:8081}

# -----------------------------
# MySQL Database
# -----------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fundoo_notes}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------
# JPA / Hibernate
# -----------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# -----------------------------
# JWT
# -----------------------------
jwt.secret=${JWT_SECRET:ThisIsMySuperSecretKeyForFundooNotesApplicationJWTToken123456}
jwt.expiration=${JWT_EXPIRATION:86400000}

# -----------------------------
# Redis
# -----------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# -----------------------------
# RabbitMQ
# -----------------------------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
rabbitmq.queue.name=${RABBITMQ_QUEUE_NAME:reminder_queue}

# -----------------------------
# File Upload
# -----------------------------
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# -----------------------------
# Swagger / API Docs
# -----------------------------
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# -----------------------------
# Gmail SMTP
# -----------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}

# -----------------------------
# Razorpay
# IMPORTANT: property names must match PaymentService @Value names
# -----------------------------
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# -----------------------------
# Frontend
# -----------------------------
frontend.url=${FRONTEND_URL:http://localhost:5173}

# -----------------------------
# Logging
# -----------------------------
logging.level.com.fundoo.notes=${APP_LOG_LEVEL:INFO}