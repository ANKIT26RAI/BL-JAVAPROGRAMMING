# -----------------------------
# Server
# -----------------------------
spring.application.name=fundoo-notes
server.port=${PORT:8081}

# -----------------------------
# MySQL
# -----------------------------
spring.datasource.url=jdbc:mysql://${RAILWAY_MYSQL_HOST}:${RAILWAY_MYSQL_PORT}/${RAILWAY_MYSQL_DB}
spring.datasource.username=${RAILWAY_MYSQL_USERNAME}
spring.datasource.password=${RAILWAY_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# -----------------------------
# JWT
# -----------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# -----------------------------
# Redis
# -----------------------------
spring.data.redis.host=${RAILWAY_REDIS_HOST}
spring.data.redis.port=${RAILWAY_REDIS_PORT}
spring.data.redis.password=${RAILWAY_REDIS_PASSWORD}

# -----------------------------
# RabbitMQ
# -----------------------------
spring.rabbitmq.host=${RAILWAY_RABBITMQ_HOST}
spring.rabbitmq.port=${RAILWAY_RABBITMQ_PORT}
spring.rabbitmq.username=${RAILWAY_RABBITMQ_USERNAME}
spring.rabbitmq.password=${RAILWAY_RABBITMQ_PASSWORD}
rabbitmq.queue.name=${RABBITMQ_QUEUE_NAME}

# -----------------------------
# File Upload
# -----------------------------
file.upload-dir=uploads

# -----------------------------
# Swagger
# -----------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# -----------------------------
# Email
# -----------------------------
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# -----------------------------
# Razorpay
# -----------------------------
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# -----------------------------
# Frontend
# -----------------------------
frontend.url=${FRONTEND_URL}

# -----------------------------
# Logging
# -----------------------------
logging.level.com.fundoo.notes=INFO